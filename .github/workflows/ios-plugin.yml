name: iOS plugin (xcframework)

# Собирает нативный iOS-плагин из ios/plugins/<plugin>/ в *.xcframework
# по официальному шаблону godot-sdk-integrations/godot-ios-plugins.
# Готовый плагин в репозиторий не коммитится: либо скачивай артефакт, либо
# ставь галочку commit_back (тогда бинарь и флаг plugins/<Name> уедут в ветку).
# Ручные шаги те же — docs/haptics.md, раздел «Сборка iOS-плагина».

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: "Имя плагина: каталог ios/plugins/<имя> и файл <имя>.gdip"
        type: string
        default: haptics
      engine_tag:
        description: "Тег движка в сабмодуле godot/ (должен совпадать с версией, которой собираем IPA)"
        type: string
        default: "4.4-stable"
      commit_back:
        description: "Закоммитить собранные *.xcframework и plugins/<Name>=true в export_presets.cfg"
        type: boolean
        default: false
  push:
    branches: [main, master]
    paths:
      - "ios/plugins/**"

env:
  PROJECT_NAME: SweetieCatsCafe
  # Держать в синхроне с ios.yml: движок экспорта и движок плагина — одной версии.
  GODOT_VERSION: "4.4"
  ENGINE_TAG: ${{ inputs.engine_tag || '4.4-stable' }}
  PLUGIN: ${{ inputs.plugin || 'haptics' }}
  # Версия API плагинов (третий аргумент generate_xcframework.sh): 4.0, не 4.4.
  PLUGIN_API: "4.0"
  TEMPLATE_REPO: https://github.com/godot-sdk-integrations/godot-ios-plugins
  WORK: .ios-plugin-build
  TEMPLATE_DIR: .ios-plugin-build/godot-ios-plugins
  TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TG_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}   # через запятую: 12345,67890

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Проверить исходники плагина
        run: |
          DIR="ios/plugins/${PLUGIN}"
          test -d "$DIR" || { echo "::error::нет каталога $DIR"; exit 1; }
          test -f "${DIR}/${PLUGIN}.gdip" || { echo "::error::нет ${DIR}/${PLUGIN}.gdip"; exit 1; }
          test -f "${DIR}/${PLUGIN}.h"    || { echo "::error::нет ${DIR}/${PLUGIN}.h"; exit 1; }
          if [ ! -f "${DIR}/${PLUGIN}.mm" ] && [ ! -f "${DIR}/${PLUGIN}.cpp" ] && [ ! -f "${DIR}/${PLUGIN}.m" ]; then
            echo "::error::в ${DIR} нет реализации (${PLUGIN}.mm/.m/.cpp) — scons соберёт пустую библиотеку"
            exit 1
          fi
          echo "— манифест —"
          cat "${DIR}/${PLUGIN}.gdip"

      - name: Кэш шаблона + сгенерированных заголовков движка
        uses: actions/cache@v4
        with:
          path: ${{ env.TEMPLATE_DIR }}
          key: ios-plugin-template-${{ env.ENGINE_TAG }}-v2

      - name: Установить scons
        run: |
          if ! command -v scons >/dev/null; then
            pipx install scons || python3 -m pip install --user --break-system-packages scons
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            echo "$(python3 -c 'import site; print(site.USER_BASE)')/bin" >> "$GITHUB_PATH"
          fi
          scons --version

      - name: Клонировать шаблон и выставить тег движка
        run: |
          if [ -f "$WORK/.template-ready" ] && [ -f "$TEMPLATE_DIR/godot/core/object/class_db.h" ]; then
            echo "шаблон из кэша"
            git -C "$TEMPLATE_DIR" log -1 --oneline 2>/dev/null || true
          else
            mkdir -p "$WORK"
            rm -rf "$TEMPLATE_DIR"
            git clone --depth 1 "$TEMPLATE_REPO" "$TEMPLATE_DIR"
            git -C "$TEMPLATE_DIR" submodule update --init --depth 1 godot
            git -C "$TEMPLATE_DIR/godot" fetch --depth 1 origin "refs/tags/${ENGINE_TAG}:refs/tags/${ENGINE_TAG}" \
              || git -C "$TEMPLATE_DIR/godot" fetch --depth 1 origin tag "$ENGINE_TAG"
            git -C "$TEMPLATE_DIR/godot" checkout -f "$ENGINE_TAG"
            touch "$WORK/.template-ready"
          fi
          echo "движок: $(git -C "$TEMPLATE_DIR/godot" describe --tags 2>/dev/null || echo unknown)"
          test -f "$TEMPLATE_DIR/godot/core/object/class_db.h" || { echo "::error::сабмодуль godot не развернулся"; exit 1; }
          test -d "$TEMPLATE_DIR/godot/platform/ios" || { echo "::error::нет platform/ios — не тот тег?"; exit 1; }

      - name: Сгенерировать заголовки движка
        run: |
          # Шаблон собирает плагин ПРОТИВ ИСХОДНИКОВ движка, но часть заголовков
          # в репозитории не лежит — их создаёт сам scons движка при сборке
          # (class_db.h включает core/disabled_classes.gen.h, resource.h —
          # core/object/gdvirtual.gen.inc). Без них сборка падает с
          # fatal error: '... gen.h/gen.inc' file not found.
          #
          # Пробуем точечно: просим scons собрать только генераторы заголовков.
          # Полнота списка не гарантируется — если чего-то не хватит, шаг сборки
          # плагина не пройдёт и там же поднимется полная сборка движка.
          cd "$TEMPLATE_DIR/godot"
          GEN="core/version_generated.gen.h core/disabled_classes.gen.h core/object/gdvirtual.gen.inc core/io/certs_compressed.gen.h core/authors.gen.h core/donors.gen.h core/license.gen.h"

          if [ ! -f core/disabled_classes.gen.h ] || [ ! -f core/object/gdvirtual.gen.inc ]; then
            scons platform=ios target=template_release -j"$(sysctl -n hw.ncpu)" $GEN || true
          fi

          ls -la core/*.gen.h core/object/*.gen.inc 2>/dev/null || true

      - name: Добавить имя плагина в SConstruct
        run: |
          cd "$TEMPLATE_DIR"
          # scons отвергает plugin=..., которого нет в EnumVariable('plugin', ...).
          python3 - "$PLUGIN" <<'PY'
          import pathlib, re, sys

          name = sys.argv[1]
          path = pathlib.Path("SConstruct")
          text = path.read_text()
          match = re.search(r"EnumVariable\(\s*'plugin'\s*,[^[]*\[([^\]]*)\]", text)
          if not match:
              sys.exit("не нашёл EnumVariable('plugin', ...) в SConstruct — шаблон изменился")
          items = [i.strip() for i in match.group(1).split(",") if i.strip()]
          if f"'{name}'" not in items:
              items.append(f"'{name}'")
              text = text[: match.start(1)] + ", ".join(items) + text[match.end(1) :]
              path.write_text(text)
          print("plugin list:", ", ".join(items))
          PY

      - name: Подложить наш плагин в шаблон
        run: |
          DEST="$TEMPLATE_DIR/plugins/$PLUGIN"
          rm -rf "$DEST"
          cp -R "ios/plugins/$PLUGIN" "$DEST"
          # В шаблон уезжают только исходники: бинарь там собирается с нуля.
          rm -f "$DEST"/*.xcframework
          ls -la "$DEST"

      - name: Собрать xcframework (device arm64 + simulator)
        run: |
          cd "$TEMPLATE_DIR"
          LOG="$GITHUB_WORKSPACE/$WORK"
          mkdir -p "$LOG"

          # Проба: хватает ли заголовков. Сборка одного плагина под arm64 — секунды.
          probe() {
            scons platform=ios target=release arch=arm64 plugin="$PLUGIN" version="$PLUGIN_API" -j"$(sysctl -n hw.ncpu)"
          }

          if probe > "$LOG/probe.log" 2>&1; then
            echo "заголовков движка хватает"
          else
            echo "::warning::плагин не собрался на сгенерированных заголовках — собираю движок целиком (20–40 мин)"
            tail -n 30 "$LOG/probe.log"
            ( cd godot && scons platform=ios target=editor -j"$(sysctl -n hw.ncpu)" )
            probe > "$LOG/probe2.log" 2>&1 || {
              tail -n 60 "$LOG/probe2.log"
              echo "::error::плагин не собрался и после полной сборки движка"
              exit 1
            }
          fi

          ./scripts/generate_xcframework.sh "$PLUGIN" release "$PLUGIN_API"
          ./scripts/generate_xcframework.sh "$PLUGIN" debug "$PLUGIN_API"
          ls -la bin

      - name: Проверить результат
        run: |
          NAME=$(grep -m1 '^name=' "ios/plugins/$PLUGIN/$PLUGIN.gdip" | cut -d'"' -f2)
          BINARY=$(grep -m1 '^binary=' "ios/plugins/$PLUGIN/$PLUGIN.gdip" | cut -d'"' -f2)
          echo "gdip: name=$NAME binary=$BINARY"
          for T in release debug; do
            F="$TEMPLATE_DIR/bin/${PLUGIN}.${T}.xcframework"
            test -d "$F" || { echo "::error::нет $F — сборка $T не прошла"; exit 1; }
            echo "— $F —"
            find "$F" -name '*.a' -print -exec lipo -info {} \;
            find "$F" -name '*.a' | while read -r LIB; do
              # .gdip пишет имя «чистой» C-функции, но библиотека собрана C++-компилятором,
              # поэтому реальный символ манглирован: _Z12haptics_initv (или __Z… на Mach-O).
              # Экспорт Godot сам генерирует объявление с тем же манглингом — так работают и
              # официальные плагины (apn, inappstore), в них тоже нет extern "C".
              if nm -g "$LIB" | awk '{print $NF}' | grep -qE "^_?(_Z[0-9]+)?${PLUGIN}_init(v)?$"; then
                echo "✓ ${PLUGIN}_init есть в $(basename "$LIB")"
              else
                echo "— что нашлось по '${PLUGIN}': —"
                nm -g "$LIB" | grep -i "$PLUGIN" || echo "(ничего)"
                echo "::error::$LIB без символа ${PLUGIN}_init (initialization из .gdip)"
                exit 1
              fi
            done
          done
          test "$BINARY" = "${PLUGIN}.xcframework" || {
            echo "::warning::binary в .gdip = '$BINARY', а собран '${PLUGIN}.xcframework'. Мультитаргет-имя — '<plugin>.release.xcframework' / '.debug.xcframework'."
          }
          echo "PLUGIN_NAME=$NAME" >> "$GITHUB_ENV"

      - name: Скопировать бинарь в проект
        run: |
          mkdir -p "ios/plugins/$PLUGIN"
          cp -R "$TEMPLATE_DIR/bin/${PLUGIN}.release.xcframework" "ios/plugins/$PLUGIN/"
          cp -R "$TEMPLATE_DIR/bin/${PLUGIN}.debug.xcframework" "ios/plugins/$PLUGIN/"
          du -sh "ios/plugins/$PLUGIN"/*.xcframework

      - name: Включить плагин в iOS-пресете
        run: |
          if grep -q "^plugins/${PLUGIN_NAME}=" export_presets.cfg; then
            echo "уже включён: $(grep "^plugins/${PLUGIN_NAME}=" export_presets.cfg)"
          elif [ "${{ inputs.commit_back }}" = "true" ]; then
            python3 - "$PLUGIN_NAME" <<'PY'
          import pathlib, sys

          name = sys.argv[1]
          path = pathlib.Path("export_presets.cfg")
          lines = path.read_text().splitlines()
          out, done = [], False
          for line in lines:
              out.append(line)
              if not done and line.strip() == "[preset.0]":
                  out.append(f"plugins/{name}=true")
                  done = True
          if not done:
              sys.exit("не нашёл секцию [preset.0] в export_presets.cfg")
          path.write_text("\n".join(out) + "\n")
          print(f"добавлено: plugins/{name}=true")
          PY
          else
            echo "::warning::в export_presets.cfg нет plugins/${PLUGIN_NAME}=true — плагин в экспорт не попадёт. Включи Project → Export… → iOS → Options → Plugins → ${PLUGIN_NAME} (или перезапусти с commit_back=true)."
          fi

      - name: Закоммитить бинарь
        if: inputs.commit_back && github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "ios/plugins/$PLUGIN" export_presets.cfg
          if git diff --cached --quiet; then
            echo "изменений нет — бинарь уже в репозитории"
          else
            git commit -m "ci(ios): собрать ${PLUGIN}.xcframework и включить плагин [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Упаковать архив
        run: |
          cd "ios/plugins/$PLUGIN"
          zip -qr "$GITHUB_WORKSPACE/${PLUGIN}-xcframework.zip" . -x '*.DS_Store'
          unzip -l "$GITHUB_WORKSPACE/${PLUGIN}-xcframework.zip" | head -n 20

      - name: Send plugin to Telegram
        if: env.TG_TOKEN != ''
        run: |
          ZIP="${PLUGIN}-xcframework.zip"
          SIZE=$(stat -f%z "$ZIP")
          echo "zip size: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -gt 52428800 ]; then
            echo "::error::архив больше 50 MB — Bot API такой файл не примет"
            exit 1
          fi

          API="https://api.telegram.org/bot${TG_TOKEN}"
          CAPTION="${PROJECT_NAME} • ${PLUGIN} xcframework • ${GITHUB_REF_NAME} • ${GITHUB_SHA:0:7}"
          FILE_ID=""
          FAILED=0

          IFS=',' read -ra IDS <<< "$TG_CHAT_IDS"
          for RAW in "${IDS[@]}"; do
            ID=$(echo "$RAW" | xargs)
            [ -z "$ID" ] && continue

            if [ -z "$FILE_ID" ]; then
              RESP=$(curl -sS -F chat_id="$ID" -F document=@"$ZIP" -F caption="$CAPTION" "$API/sendDocument")
              FILE_ID=$(echo "$RESP" | jq -r '.result.document.file_id // empty')
            else
              RESP=$(curl -sS -F chat_id="$ID" -F document="$FILE_ID" -F caption="$CAPTION" "$API/sendDocument")
            fi

            if [ "$(echo "$RESP" | jq -r '.ok')" = "true" ]; then
              echo "✓ sent to $ID"
            else
              echo "::warning::не отправлено в $ID: $(echo "$RESP" | jq -r '.description')"
              FAILED=$((FAILED + 1))
            fi
          done

          [ "$FAILED" -eq 0 ] || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PLUGIN }}-xcframework
          path: ${{ env.PLUGIN }}-xcframework.zip

      - name: Подготовить кэш (убрать .git и объекты движка)
        if: always()
        run: |
          rm -rf "$TEMPLATE_DIR/.git" "$TEMPLATE_DIR/godot/.git"
          find "$TEMPLATE_DIR/godot" -name '*.o' -delete 2>/dev/null || true
          du -sh "$WORK" 2>/dev/null || true
