name: iOS unsigned IPA (Sideloadly-ready)

on:
  workflow_dispatch:
    inputs:
      strict_free_signing:
        description: "Падать, если в iOS-пресете включены entitlements (Push / Game Center), которые не подпишет бесплатный Apple ID"
        type: boolean
        default: true

env:
  GODOT_VERSION: "4.4"
  PROJECT_NAME: SweetieCatsCafe
  TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TG_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}   # через запятую: 12345,67890


jobs:
  # Собирает НЕподписанный IPA под устройство (arm64, iphoneos).
  # Такой IPA подписывает Sideloadly своим Apple ID (в т.ч. бесплатным) — см. docs/ios-testing.md.
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          cd "$RUNNER_TEMP"
          curl -L -o godot.zip $BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          curl -L -o templates.tpz $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d tmp_templates
          mv tmp_templates/templates/* ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable/
          echo "GODOT=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> $GITHUB_ENV

      - name: Check iOS preset (совместимость с бесплатным Apple ID)
        run: |
          echo "— entitlements/capabilities в export_presets.cfg —"
          grep -E '^(entitlements|capabilities)/' export_presets.cfg || echo "(нет)"
          TEAM_ID=$(grep -m1 'application/app_store_team_id' export_presets.cfg | cut -d'"' -f2)
          echo "application/app_store_team_id='${TEAM_ID}' (для unsigned-сборки и Sideloadly не важен)"

          if [ "${{ inputs.strict_free_signing }}" = "true" ]; then
            if ! grep -q 'entitlements/push_notifications="Disabled"' export_presets.cfg; then
              echo "::error::entitlements/push_notifications != \"Disabled\". Бесплатный Apple ID (Sideloadly) такой профиль не подпишет. Отключи Push Notifications в iOS-пресете (Project → Export → iOS → Capabilities)."
              exit 1
            fi
            if ! grep -q 'entitlements/game_center=false' export_presets.cfg; then
              echo "::error::entitlements/game_center=true — Game Center недоступен на бесплатном Apple ID."
              exit 1
            fi
            echo "✓ entitlements совместимы с бесплатным Apple ID"
          else
            echo "::warning::strict_free_signing=false — проверку entitlements пропускаю"
          fi

      - name: Export Xcode project
        run: |
          mkdir -p build/ios
          "$GODOT" --headless --import || true
          # Имя .xcodeproj Godot берёт из пути экспорта (${PROJECT_NAME}), а имя на
          # иконке — из config/name; путь к проекту всё равно ищем, а не хардкодим.
          "$GODOT" --headless --export-release "iOS" build/ios/${PROJECT_NAME}
          XCPROJ=$(find build/ios -maxdepth 3 -name "*.xcodeproj" | head -n1)
          if [ -z "$XCPROJ" ]; then
            echo "::error::Xcode-проект не найден после экспорта"
            find build -maxdepth 4
            exit 1
          fi
          echo "XCPROJ=$XCPROJ" >> $GITHUB_ENV
          echo "SCHEME=$(basename "$XCPROJ" .xcodeproj)" >> $GITHUB_ENV

      - name: Build without signing (device, arm64)
        run: |
          xcodebuild archive \
            -project "$XCPROJ" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath build/app.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          APP=$(ls -d Payload/*.app | head -n1)
          echo "Бандл: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
          echo "Версия: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"))"
          zip -qr ${PROJECT_NAME}.ipa Payload
          unzip -l ${PROJECT_NAME}.ipa | head -n 5

      - name: Send IPA to Telegram
        if: env.TG_TOKEN != ''
        run: |
          IPA="${PROJECT_NAME}.ipa"
          SIZE=$(stat -f%z "$IPA")
          echo "IPA size: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -gt 52428800 ]; then
            echo "::error::IPA больше 50 MB — Bot API такой файл не примет"
            exit 1
          fi

          API="https://api.telegram.org/bot${TG_TOKEN}"
          CAPTION="${PROJECT_NAME} • ipa • ${GITHUB_REF_NAME} • ${GITHUB_SHA:0:7}"
          FILE_ID=""
          FAILED=0

          IFS=',' read -ra IDS <<< "$TG_CHAT_IDS"
          for RAW in "${IDS[@]}"; do
            ID=$(echo "$RAW" | xargs)
            [ -z "$ID" ] && continue

            if [ -z "$FILE_ID" ]; then
              # первый получатель — реальная загрузка файла
              RESP=$(curl -sS -F chat_id="$ID" -F document=@"$IPA" -F caption="$CAPTION" "$API/sendDocument")
              FILE_ID=$(echo "$RESP" | jq -r '.result.document.file_id // empty')
            else
              # остальным — по file_id, без повторной загрузки
              RESP=$(curl -sS -F chat_id="$ID" -F document="$FILE_ID" -F caption="$CAPTION" "$API/sendDocument")
            fi

            if [ "$(echo "$RESP" | jq -r '.ok')" = "true" ]; then
              echo "✓ sent to $ID"
            else
              echo "::warning::не отправлено в $ID: $(echo "$RESP" | jq -r '.description')"
              FAILED=$((FAILED + 1))
            fi
          done

          [ "$FAILED" -eq 0 ] || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-ipa
          path: ${{ env.PROJECT_NAME }}.ipa
