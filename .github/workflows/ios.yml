name: iOS unsigned build

on:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4"
  PROJECT_NAME: TestGame
  TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TG_CHAT_IDS: ${{ secrets.TELEGRAM_CHAT_IDS }}   # через запятую: 12345,67890


jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot + export templates
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          cd "$RUNNER_TEMP"
          curl -L -o godot.zip $BASE/Godot_v${GODOT_VERSION}-stable_macos.universal.zip
          curl -L -o templates.tpz $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q godot.zip
          mkdir -p ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable
          unzip -q templates.tpz -d tmp_templates
          mv tmp_templates/templates/* ~/Library/Application\ Support/Godot/export_templates/${GODOT_VERSION}.stable/
          echo "GODOT=$RUNNER_TEMP/Godot.app/Contents/MacOS/Godot" >> $GITHUB_ENV

      - name: Export Xcode project
        run: |
          mkdir -p build
          "$GODOT" --headless --import || true
          "$GODOT" --headless --export-release "iOS" build/${PROJECT_NAME}.xcodeproj

      - name: Build without signing
        run: |
          xcodebuild archive \
            -project build/${PROJECT_NAME}.xcodeproj \
            -scheme ${PROJECT_NAME} \
            -configuration Release \
            -archivePath build/app.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/app.xcarchive/Products/Applications/*.app Payload/
          zip -qr ${PROJECT_NAME}.ipa Payload

      - name: Send IPA to Telegram
        run: |
          IPA="${PROJECT_NAME}.ipa"
          SIZE=$(stat -f%z "$IPA")
          echo "IPA size: $((SIZE / 1024 / 1024)) MB"
          if [ "$SIZE" -gt 52428800 ]; then
            echo "::error::IPA больше 50 MB — Bot API такой файл не примет"
            exit 1
          fi

          API="https://api.telegram.org/bot${TG_TOKEN}"
          CAPTION="${PROJECT_NAME} • ${GITHUB_REF_NAME} • ${GITHUB_SHA:0:7}"
          FILE_ID=""
          FAILED=0

          IFS=',' read -ra IDS <<< "$TG_CHAT_IDS"
          for RAW in "${IDS[@]}"; do
            ID=$(echo "$RAW" | xargs)
            [ -z "$ID" ] && continue

            if [ -z "$FILE_ID" ]; then
              # первый получатель — реальная загрузка файла
              RESP=$(curl -sS -F chat_id="$ID" -F document=@"$IPA" -F caption="$CAPTION" "$API/sendDocument")
              FILE_ID=$(echo "$RESP" | jq -r '.result.document.file_id // empty')
            else
              # остальным — по file_id, без повторной загрузки
              RESP=$(curl -sS -F chat_id="$ID" -F document="$FILE_ID" -F caption="$CAPTION" "$API/sendDocument")
            fi

            if [ "$(echo "$RESP" | jq -r '.ok')" = "true" ]; then
              echo "✓ sent to $ID"
            else
              echo "::warning::не отправлено в $ID: $(echo "$RESP" | jq -r '.description')"
              FAILED=$((FAILED + 1))
            fi
          done

          [ "$FAILED" -eq 0 ] || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PROJECT_NAME }}-ipa
          path: ${{ env.PROJECT_NAME }}.ipa